name: Build iOS IPA (unsigned)
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build unsigned archive
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr Tianqi.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: tianqi-ipa, path: app/ios/App/Tianqi.ipa }
