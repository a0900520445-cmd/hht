<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="天氣">
<meta name="theme-color" content="#2a7de1"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>天氣</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a7de1;color:#fff;font:16px/1.4 -apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;overscroll-behavior:none}
#sky{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--a),var(--b));transition:background .8s}
body{--a:#3d92ee;--b:#8fd2ff}
body[data-k=clear][data-n="1"]{--a:#0a1a3e;--b:#2c418a}
body[data-k=cloudy]{--a:#6a92bd;--b:#acc4da}body[data-k=cloudy][data-n="1"]{--a:#192338;--b:#3a4c69}
body[data-k=overcast]{--a:#79858f;--b:#a6afba}body[data-k=overcast][data-n="1"]{--a:#212832;--b:#3e4755}
body[data-k=rain]{--a:#46586d;--b:#7c90a6}body[data-k=rain][data-n="1"]{--a:#121a25;--b:#2b394a}
body[data-k=storm]{--a:#2b3441;--b:#566375}body[data-k=storm][data-n="1"]{--a:#0a0f16;--b:#212b39}
body[data-k=fog]{--a:#98a3af;--b:#c5ccd4}body[data-k=fog][data-n="1"]{--a:#29303a;--b:#49525d}
.bgimg{position:absolute;inset:0;background:var(--img) center/cover;opacity:.9}
.sun{position:absolute;top:-80px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.95) 0,rgba(255,214,90,.45) 35%,transparent 68%);opacity:0;transition:opacity .8s;animation:pulse 6s ease-in-out infinite}
body[data-k=clear][data-n="0"] .sun,body[data-k=cloudy][data-n="0"] .sun{opacity:1}
body[data-k=clear][data-n="1"] .sun{opacity:.7;background:radial-gradient(circle,rgba(235,240,255,.95) 0,rgba(200,215,255,.35) 22%,transparent 55%);width:240px;height:240px}
@keyframes pulse{50%{transform:scale(1.08)}}
.cl{position:absolute;width:420px;height:150px;border-radius:80px;background:rgba(255,255,255,.55);filter:blur(28px);opacity:0;transition:opacity .8s;animation:drift 38s linear infinite}
.c1{top:12%;left:-30%}.c2{top:30%;left:-60%;animation-duration:55s;width:520px}.c3{top:5%;left:-10%;animation-duration:70s;height:120px}
@keyframes drift{to{transform:translateX(160vw)}}
body:not([data-k=clear]) .cl{opacity:.8}body[data-k=overcast] .cl,body[data-k=rain] .cl,body[data-k=storm] .cl{background:rgba(120,130,145,.7)}
body[data-k=fog] .cl{background:rgba(235,238,242,.8);opacity:1}
body[data-n="1"] .cl{background:rgba(60,72,95,.6)}
#stars{position:absolute;inset:0;opacity:0;transition:opacity .8s}
body[data-n="1"][data-k=clear] #stars,body[data-n="1"][data-k=cloudy] #stars{opacity:1}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
#fx{position:absolute;inset:0;width:100%;height:100%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
body[data-k=storm] #flash{animation:fl 7s infinite}
@keyframes fl{0%,92%,100%{opacity:0}93%{opacity:.55}94%{opacity:.05}95%{opacity:.4}97%{opacity:0}}
#app{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{border:0;color:#fff;background:rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;transition:transform .2s,background .2s}.pill:active{transform:scale(.94);background:rgba(255,255,255,.32)}
.hero{text-align:center;padding:26px 0 18px;transform-origin:top center;will-change:opacity,transform}
.city{font-size:30px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.15)}
.temp{font-size:104px;font-weight:200;line-height:1.05;letter-spacing:-4px;margin-left:14px;animation:up .7s both}
.wx{font-size:20px;font-weight:500;margin-top:-4px}.hl{font-size:17px;margin-top:2px;opacity:.95}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.warn{margin:6px 0 14px;padding:10px 14px;border-radius:16px;background:rgba(255,196,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;animation:up .6s .1s both}
.card{background:rgba(255,255,255,.17);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-radius:22px;padding:14px 16px;margin-bottom:12px;animation:up .6s both;animation-delay:calc(var(--i,0) * 90ms + 150ms);border:1px solid rgba(255,255,255,.12)}
body[data-n="0"][data-k=fog] .card,body[data-n="0"][data-k=overcast] .card{background:rgba(70,80,95,.25)}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:600;letter-spacing:.5px;opacity:.75;text-transform:uppercase}
.hrs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -6px;padding:0 6px}.hrs::-webkit-scrollbar{display:none}
.h{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px}.h span{opacity:.85}.h b{font-size:17px;font-weight:500}.h small{font-size:11.5px;color:#a9d8ff;min-height:14px}
.wi{width:32px;height:32px}
.d{display:grid;grid-template-columns:44px 36px 40px 30px 1fr 30px;align-items:center;gap:6px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14);font-size:16px}.d:first-of-type{border-top:0}
.d .wi{width:28px;height:28px}.d small{color:#a9d8ff;font-size:12px}.d .lo{opacity:.65;text-align:right}
.bar{height:5px;border-radius:5px;background:rgba(0,0,0,.2);position:relative}.bar u{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#6cc5ff,#ffd84a,#ff9a3c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tiles .card{margin:0;min-height:112px}
.tiles b{font-size:30px;font-weight:300;display:block}.tiles small{display:block;margin-top:4px;opacity:.85;font-size:13px}
.upd{text-align:center;font-size:12px;opacity:.7;margin:16px 0}
#sheet{position:fixed;inset:0;pointer-events:none;z-index:9}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:70%;overflow:auto;background:rgba(28,36,48,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px 26px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.8,.3,1)}
#sheet.on{pointer-events:auto}#sheet.on .bk{opacity:1}#sheet.on .pn{transform:none}
.pn h2{margin:0 0 8px;font-size:18px}.pn button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font:inherit;font-size:18px;padding:14px 4px;text-align:left}.pn button:active{background:rgba(255,255,255,.08)}.pn small{opacity:.6;font-size:13px;align-self:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);background:rgba(0,0,0,.7);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.35s;z-index:10}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body data-k="clear" data-n="0">
<div id="sky"><div class="bgimg" id="bgi"></div><div id="stars"></div><div class="sun"></div><div class="cl c1"></div><div class="cl c2"></div><div class="cl c3"></div><canvas id="fx"></canvas><div id="flash"></div></div>
<div id="app"><div class="top"><button class="pill" id="pick">📍 選擇地點</button><button class="pill" id="ref">更新</button></div><div id="out"></div></div>
<div id="sheet"><div class="bk"></div><div class="pn"><h2>選擇地點</h2><div id="list"></div></div></div><div id="toast"></div>
<script>
const API = location.hostname.endsWith('onrender.com') ? '' : 'https://hht-katk.onrender.com';
const $ = s => document.querySelector(s), V = (x, u = '') => x == null || x === '' ? '—' : x + u;
let locs = [], cur = +localStorage.cid || 0, tm;
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tm); tm = setTimeout(() => e.classList.remove('on'), 2200); };
const j = async p => { const r = await fetch(API + p); if (!r.ok) throw 0; return r.json(); };
const kind = w => /雷/.test(w) ? 'storm' : /雨/.test(w) ? 'rain' : /霧/.test(w) ? 'fog' : /陰/.test(w) ? 'overcast' : /多雲/.test(w) ? 'cloudy' : 'clear';
// 圖示
const S = b => `<svg class="wi" viewBox="0 0 56 56">${b}</svg>`, cl = (c, t = '') => `<path ${t} d="M15 42a9 9 0 0 1 1-18 13 13 0 0 1 25 4 7.5 7.5 0 0 1-1 14z" fill="${c}"/>`;
const sun = (x = 28, y = 28, r = 9) => `<g stroke="#ffc933" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => { const R = a * Math.PI / 180, c = Math.cos(R), s = Math.sin(R); return `<line x1="${x + c*(r+4)}" y1="${y + s*(r+4)}" x2="${x + c*(r+8)}" y2="${y + s*(r+8)}"/>`; }).join('')}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd54a"/>`;
const ico = w => { const k = kind(w || '');
  if (k === 'storm') return S(cl('#cfd6e0', 'transform="translate(0,-4)"') + '<path d="M30 36l-6 9h5l-2 8 8-11h-5l3-6z" fill="#ffd54a"/>');
  if (k === 'rain') return S(cl('#e0e7ef', 'transform="translate(0,-5)"') + '<g stroke="#7cc0ff" stroke-width="3" stroke-linecap="round"><line x1="20" y1="47" x2="18" y2="53"/><line x1="29" y1="47" x2="27" y2="53"/><line x1="38" y1="47" x2="36" y2="53"/></g>');
  if (k === 'fog') return S(cl('#eef1f5', 'transform="translate(0,-6)"') + '<g stroke="#dfe5ec" stroke-width="3" stroke-linecap="round"><line x1="12" y1="45" x2="44" y2="45"/><line x1="18" y1="51" x2="50" y2="51"/></g>');
  if (k === 'overcast') return S(cl('#dfe5ec'));
  if (k === 'cloudy') return S(sun(21, 20, 7) + cl('#f4f7fb', 'transform="translate(2,4)"'));
  return S(sun()); };
// 背景特效
const cv = $('#fx'), g = cv.getContext('2d'); let drops = [], raf;
const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }; fit(); addEventListener('resize', fit);
const rain = on => { cancelAnimationFrame(raf); g.clearRect(0, 0, cv.width, cv.height); if (!on) return;
  drops = Array.from({ length: 110 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, l: 12 + Math.random() * 18, v: 14 + Math.random() * 12 }));
  const f = () => { g.clearRect(0, 0, cv.width, cv.height); g.strokeStyle = 'rgba(210,230,255,.45)'; g.lineWidth = 1.4 * devicePixelRatio; g.beginPath();
    drops.forEach(d => { g.moveTo(d.x, d.y); g.lineTo(d.x - 3, d.y + d.l * devicePixelRatio); d.y += d.v * devicePixelRatio; d.x -= 1.2; if (d.y > cv.height) { d.y = -20; d.x = Math.random() * cv.width; } }); g.stroke(); raf = requestAnimationFrame(f); }; f(); };
$('#stars').innerHTML = Array.from({ length: 70 }, () => `<i style="left:${Math.random()*100}%;top:${Math.random()*60}%;animation-delay:${Math.random()*3}s"></i>`).join('');
// 畫面
function render(d, warns) {
  const dl = d.daily || [], t0 = dl[0] || {}, o = d.now || {}, hr = d.hourly || [], a = d.air;
  const w = t0.wx || (hr[0] && hr[0].wx) || '晴', k = kind(w), h = new Date().getHours();
  document.body.dataset.k = k; document.body.dataset.n = (h < 6 || h >= 18) ? 1 : 0;
  $('#sky').style.setProperty('--img', `url(bg/${k}-${(h < 6 || h >= 18) ? 'night' : 'day'}.jpg)`); $('#bgi').style.setProperty('--img', `url(bg/${k}-${(h < 6 || h >= 18) ? 'night' : 'day'}.jpg)`);
  rain(k === 'rain' || k === 'storm');
  const hs = dl.map(x => +x.temp_high), ls = dl.map(x => +x.temp_low), mx = Math.max(...hs), mn = Math.min(...ls), sp = Math.max(mx - mn, 1);
  const wn = (warns || []).slice(0, 2).map(x => `<div class="warn">⚠️ ${x.title}</div>`).join('');
  const temp = o.temp != null ? Math.round(o.temp) : (t0.temp_high != null ? Math.round(t0.temp_high) : '—');
  $('#out').innerHTML = `<div class="hero" id="hero"><div class="city">${(d.location || {}).name || ''}</div><div class="temp">${temp}°</div><div class="wx">${w}</div><div class="hl">最高 ${V(t0.temp_high)}°　最低 ${V(t0.temp_low)}°</div></div>${wn}
  ${hr.length ? `<div class="card" style="--i:0"><h3>逐時預報</h3><div class="hrs">${hr.map((x, i) => `<div class="h"><span>${i ? new Date(x.forecast_time).getHours() + '時' : '現在'}</span>${ico(x.wx)}<b>${V(x.temp)}°</b><small>${x.pop >= 20 ? x.pop + '%' : ''}</small></div>`).join('')}</div></div>` : ''}
  ${dl.length ? `<div class="card" style="--i:1"><h3>未來 ${dl.length} 天</h3>${dl.map((x, i) => `<div class="d"><span>${i ? '週' + '日一二三四五六'[new Date(x.forecast_date + 'T00:00:00').getDay()] : '今天'}</span>${ico(x.wx)}<small>${x.pop >= 20 ? x.pop + '%' : ''}</small><span class="lo">${V(x.temp_low)}°</span><div class="bar"><u style="left:${((x.temp_low - mn) / sp * 100).toFixed(0)}%;width:${Math.max((x.temp_high - x.temp_low) / sp * 100, 10).toFixed(0)}%"></u></div><span>${V(x.temp_high)}°</span></div>`).join('')}</div>` : '<div class="card">目前沒有預報資料</div>'}
  <div class="tiles">
   <div class="card" style="--i:2"><h3>空氣品質</h3><b>${a ? a.aqi : '—'}</b><small>${a ? (a.status || '') : ''}</small></div>
   <div class="card" style="--i:3"><h3>紫外線</h3><b>${V(t0.uvi)}</b><small>${t0.uvi >= 8 ? '過量' : t0.uvi >= 6 ? '高' : t0.uvi >= 3 ? '中等' : '低'}</small></div>
   <div class="card" style="--i:4"><h3>風</h3><b>${V(o.wind_speed)}<small style="display:inline"> m/s</small></b><small>${o.wind_dir != null ? '風向 ' + o.wind_dir + '°' : ''}</small></div>
   <div class="card" style="--i:5"><h3>相對溼度</h3><b>${V(o.humidity, '%')}</b><small>降雨機率 ${V(t0.pop, '%')}</small></div>
   <div class="card" style="--i:6"><h3>氣壓</h3><b>${V(o.pressure)}</b><small>hPa</small></div>
   <div class="card" style="--i:7"><h3>能見度</h3><b>${V(o.visibility)}</b><small>公里　時雨量 ${V(o.rain_1h)} mm</small></div>
  </div><div class="upd">更新於 ${new Date(d.updated).toLocaleTimeString('zh-TW', { hour12: false })}　資料來源：虛擬中央氣象局</div>`;
}
async function load(quiet) {
  try {
    if (!locs.length) { locs = await j('/api/locations'); if (!locs.find(l => l.id === cur)) cur = (locs[0] || {}).id; $('#list').innerHTML = locs.map(l => `<button data-id="${l.id}">${l.name}<small>${l.region || ''}</small></button>`).join(''); }
    const [d, w] = await Promise.all([j('/api/weather/' + cur), j('/api/warnings')]);
    render(d, w); localStorage.cache = JSON.stringify([d, w]); if (quiet === 'm') toast('已更新');
  } catch (e) { const c = localStorage.cache; if (c) { render(...JSON.parse(c)); toast('目前離線，顯示上次的資料'); } else toast('無法連線，請檢查網路'); }
}
$('#pick').onclick = () => $('#sheet').classList.add('on');
$('#sheet .bk').onclick = () => $('#sheet').classList.remove('on');
$('#list').onclick = e => { const b = e.target.closest('button'); if (!b) return; cur = +b.dataset.id; localStorage.cid = cur; $('#sheet').classList.remove('on'); load(); };
$('#ref').onclick = () => load('m');
$('#app').addEventListener('scroll', e => { const h = $('#hero'); if (h) { const p = Math.min(e.target.scrollTop / 180, 1); h.style.opacity = 1 - p; h.style.transform = `scale(${1 - p * .08})`; } });
document.addEventListener('visibilitychange', () => !document.hidden && load());
setInterval(load, 300000); load();
</script></body></html>
