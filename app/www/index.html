<script>
const API = location.hostname.endsWith('onrender.com') ? '' : 'https://hht-katk.onrender.com';
const $ = s => document.querySelector(s), V = (x, u = '') => x == null || x === '' ? '—' : x + u;
let locs = [], cur = +localStorage.cid || 0, tm, D = null, W = [], view = 'wx';

const j = async p => { const r = await fetch(API + p); if (!r.ok) throw 0; return r.json(); };
const kind = w => /雷/.test(w) ? 'storm' : /雨/.test(w) ? 'rain' : /霧/.test(w) ? 'fog' : /陰/.test(w) ? 'overcast' : /多雲/.test(w) ? 'cloudy' : 'clear';
const hm = d => d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });
const fdt = v => v ? new Date(v).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '—';
const dayName = (s, i) => i === 0 ? '今天' : '週' + '日一二三四五六'[new Date(s + 'T00:00:00').getDay()];
// ---- 圖示 ----
const S = b => `<svg class="wi" width="32" height="32" viewBox="0 0 56 56">${b}</svg>`, cl = (c, t = '') => `<path ${t} d="M15 42a9 9 0 0 1 1-18 13 13 0 0 1 25 4 7.5 7.5 0 0 1-1 14z" fill="${c}"/>`;
const sun = (x = 28, y = 28, r = 9) => `<g stroke="#ffc933" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => { const R = a * Math.PI / 180, c = Math.cos(R), s = Math.sin(R); return `<line x1="${x + c*(r+4)}" y1="${y + s*(r+4)}" x2="${x + c*(r+8)}" y2="${y + s*(r+8)}"/>`; }).join('')}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd54a"/>`;
const ico = w => { const k = kind(w || '');
  if (k === 'storm') return S(cl('#cfd6e0', 'transform="translate(0,-4)"') + '<path d="M30 36l-6 9h5l-2 8 8-11h-5l3-6z" fill="#ffd54a"/>');
  if (k === 'rain') return S(cl('#e0e7ef', 'transform="translate(0,-5)"') + '<g stroke="#7cc0ff" stroke-width="3" stroke-linecap="round"><line x1="20" y1="47" x2="18" y2="53"/><line x1="29" y1="47" x2="27" y2="53"/><line x1="38" y1="47" x2="36" y2="53"/></g>');
  if (k === 'fog') return S(cl('#eef1f5', 'transform="translate(0,-6)"') + '<g stroke="#dfe5ec" stroke-width="3" stroke-linecap="round"><line x1="12" y1="45" x2="44" y2="45"/><line x1="18" y1="51" x2="50" y2="51"/></g>');
  if (k === 'overcast') return S(cl('#dfe5ec'));
  if (k === 'cloudy') return S(sun(21, 20, 7) + cl('#f4f7fb', 'transform="translate(2,4)"'));
  return S(sun()); };
// ---- 計算 ----
const feels = (T, rh, ws) => T + 0.33 * (rh / 100 * 6.105 * Math.exp(17.27 * T / (237.7 + T))) - 0.7 * ws - 4;
const dew = (T, rh) => { const g = Math.log(rh / 100) + 17.27 * T / (237.7 + T); return 237.7 * g / (17.27 - g); };
function sunT(d, lat, lon) {
  const r = Math.PI / 180, y = d.getFullYear(), m = d.getMonth(), dd = d.getDate(), n = Math.floor((Date.UTC(y, m, dd) - Date.UTC(y, 0, 0)) / 864e5), g = 2 * Math.PI / 365 * (n - 1);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));

  const ha = Math.acos(Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(dc)) - Math.tan(lat * r) * Math.tan(dc)) / r, b = Date.UTC(y, m, dd);
  return [new Date(b + (720 - 4 * (lon + ha) - eq) * 6e4), new Date(b + (720 - 4 * (lon - ha) - eq) * 6e4)];
}
const moon = d => { const age = (((d.getTime() / 864e5 + 2440587.5) - 2451550.1) / 29.530588853 % 1 + 1) % 1; return { e: ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'][Math.round(age * 8) % 8], ill: Math.round((1 - Math.cos(2 * Math.PI * age)) / 2 * 100),
  n: ['新月', '娥眉月', '上弦月', '盈凸月', '滿月', '虧凸月', '下弦月', '殘月'][Math.round(age * 8) % 8] }; };
const BF = ['無風', '軟風', '輕風', '微風', '和風', '清風', '強風', '疾風', '大風', '烈風', '狂風', '暴風', '颶風'], BT = [0.3, 1.6, 3.4, 5.5, 8, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
const bf = ms => { const i = BT.findIndex(x => ms < x); return i < 0 ? 12 : i; };
const WD = ['北', '北北東', '東北', '東北東', '東', '東南東', '東南', '南南東', '南', '南南西', '西南', '西南西', '西', '西北西', '西北', '北北西'], wdir = d => WD[Math.round(d / 22.5) % 16];
const uvl = u => u >= 11 ? '危險' : u >= 8 ? '過量' : u >= 6 ? '高' : u >= 3 ? '中等' : '低';
const uvAdv = u => u >= 8 ? '避免正午外出，務必防曬' : u >= 6 ? '外出請擦防曬、戴帽子' : u >= 3 ? '長時間外出建議防曬' : '不需特別防護';
const aqiC = a => a <= 50 ? '良好' : a <= 100 ? '普通' : a <= 150 ? '對敏感族群不健康' : a <= 200 ? '對所有族群不健康' : '非常不健康';
const advice = (T, t0, a) => { const l = []; if (T != null) l.push(T <= 14 ? '天氣寒冷，建議穿厚外套保暖' : T <= 19 ? '稍有涼意，帶一件外套' : T >= 30 ? '天氣炎熱，多補充水分' : '體感舒適，穿著輕便即可');
  if (t0.pop >= 50) l.push('降雨機率高，出門記得帶傘'); else if (t0.pop >= 30) l.push('有機會下雨，可備折疊傘');
  if (t0.uvi >= 6) l.push('紫外線偏強，注意防曬'); if (a && a.aqi > 100) l.push('空氣品質不佳，敏感族群減少戶外活動'); return l; };
// ---- 圖表 ----
function tempChart(hr) {
  const v = hr.map(x => +x.temp).filter(x => !isNaN(x)); if (v.length < 3) return '';
  const mn = Math.min(...v), mx = Math.max(...v), sp = Math.max(mx - mn, 1), n = v.length, X = i => 14 + i * (292 / (n - 1)), Y = t => 14 + (1 - (t - mn) / sp) * 62;
  const pts = v.map((t, i) => `${X(i).toFixed(1)},${Y(t).toFixed(1)}`).join(' '), imx = v.indexOf(mx), imn = v.indexOf(mn);
  return `<svg viewBox="0 0 320 100" style="width:100%"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <polygon points="14,92 ${pts} 306,92" fill="url(#tg)"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="${X(imx)}" cy="${Y(mx)}" r="3.5" fill="#fff"/><text x="${X(imx)}" y="${Y(mx) - 7}" font-size="11" text-anchor="middle">${mx.toFixed(0)}°</text>
  <circle cx="${X(imn)}" cy="${Y(mn)}" r="3.5" fill="#fff"/><text x="${X(imn)}" y="${Y(mn) + 15}" font-size="11" text-anchor="middle">${mn.toFixed(0)}°</text></svg>`;
}
function rainChart(hr) {

  ${hr.map((x, i) => i % 4 === 0 ? `<text x="${14 + i * w + w / 2}" y="80" font-size="10" text-anchor="middle" opacity=".75">${new Date(x.forecast_time).getHours()}時</text>` : '').join('')}
  <text x="14" y="10" font-size="10" opacity=".75">100%</text></svg>`;
}

  <g transform="rotate(${deg || 0} 50 50)"><path d="M50 12 L56 30 L44 30Z" fill="#fff"/></g><text x="50" y="55" font-size="17" text-anchor="middle">${spd ?? '—'}</text><text x="50" y="68" font-size="8.5" text-anchor="middle" opacity=".75">m/s</text></svg>`;

    drops.forEach(d => { g.moveTo(d.x, d.y); g.lineTo(d.x - 3, d.y + d.l * devicePixelRatio); d.y += d.v * devicePixelRatio; d.x -= 1.2; if (d.y > cv.height) { d.y = -20; d.x = Math.random() * cv.width; } }); g.stroke(); raf = requestAnimationFrame(f); }; f(); };

async function load(q) {

}

let map, layers = [], frames = [], ri = 0, rt;

async function initRadar() {
